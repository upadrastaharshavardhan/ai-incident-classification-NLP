# ============================================================
# Intelligent IT Incident Classification & Priority Prediction
# ============================================================

project:
  name: "ai-incident-classification"
  version: "1.0.0"

paths:
  data_dir: "data"
  artifacts_dir: "artifacts"
  raw_data: "data/incidents.csv"
  embeddings: "artifacts/embeddings.npy"
  category_classifier: "artifacts/category_classifier.joblib"
  priority_classifier: "artifacts/priority_classifier.joblib"
  metadata: "artifacts/metadata.csv"
  faiss_index: "artifacts/faiss.index"

data:
  n_samples: 4000
  random_seed: 42
  test_size: 0.2

categories:
  - Network
  - Software
  - Hardware
  - Security
  - Access
  - Database
  - CloudInfra
  - Performance
  - Other

priorities:
  - P1-Critical
  - P2-High
  - P3-Medium
  - P4-Low

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  batch_size: 64
  device: "cuda"
  normalize: true

classifier:
  type: "logistic"          # logistic | random_forest
  max_iter: 1000
  class_weight: "balanced"
  n_estimators: 200
  random_state: 42

similarity:
  top_k: 5
  metric: "cosine"

preprocessing:
  max_text_length: 1500
  remove_ticket_ids: true
  remove_emails: true
  remove_urls: true
  remove_timestamps: true
  extract_key_phrases: false
  spacy_model: "en_core_web_sm"

gradio:
  title: "IT Incident Classifier & Priority Predictor"
  description: "Paste an incident title + description to get predicted category, priority, and similar historical tickets."
  share: false
